{% extends "base.html" %}
{% block content %}
    <h2>쓰레기통 현황</h2>
    <table>
        <thead>
            <tr>
                <th>번호 (ID)</th>
                <th>이름 (종류)</th>
                <th>상태</th>
            </tr>
        </thead>
        <tbody>
            {% for bin in bins %}
            <tr>
                <td>{{ bin.id }}</td>
                <td>{{ bin.name }}</td>
                <td style="color: {{ 'red' if bin.is_full else 'green' }};">
                    <strong>{{ "꽉 참" if bin.is_full else "보통" }}</strong>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="3">등록된 쓰레기통 정보가 없습니다.</td></tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
