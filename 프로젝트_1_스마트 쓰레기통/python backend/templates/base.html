<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>쓰레기통 관리 대시보드</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        header { background-color: #333; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; margin-right: 15px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .container { padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #eee; }
        .form-section { background-color: white; padding: 15px; margin-bottom: 20px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <header>
        <div>
            <strong>관리 시스템</strong>
            <nav style="display:inline-block; margin-left:20px;">
                <a href="{{ url_for('main') }}">메인</a>
                <a href="{{ url_for('logs') }}">로그</a>
                <a href="{{ url_for('manage_user') }}">사용자 관리</a>
            </nav>
        </div>
        <div>
            <a href="{{ url_for('logout') }}" style="color: white; text-decoration: none;">로그아웃</a>
        </div>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
